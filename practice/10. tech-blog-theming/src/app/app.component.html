<nav class="main-nav">
    <div class="nav-content">
        <div class="nav-left">
            <a routerLink="/home" class="logo">Tech Blog</a>
        </div>
        <div class="nav-right">
            <div class="theme-controls">
                <select class="theme-select" 
                    #colorSelect
                    title="Select color theme"
                    [value]="themeService.selectedColor().name"
                    (change)="themeService.setColor(colorSelect.value)"
                >
                    @for(option  of themeService.possibleColors; track option.name) {
                        <option [value]="option.name">{{ option.name }}</option>
                    }
                </select>
                <div class="mode-select">
                    <button class="mode-button" 
                            title="Light mode" 
                            [class.active]="themeService.selectedScheme().value === 'light'"
                            (click)="themeService.setScheme('light')"
                    >☀️</button>
                    <button class="mode-button" 
                            title="System mode"
                            [class.active]="themeService.selectedScheme().value === 'light-dark'" 
                            (click)="themeService.setScheme('light-dark')"
                    >💻</button>
                    <button class="mode-button" 
                            title="Dark mode" 
                            [class.active]="themeService.selectedScheme().value === 'dark'"
                            (click)="themeService.setScheme('dark')"
                    >🌙</button>
                </div>
            </div>
        </div>
    </div>
</nav>

<main>
    <router-outlet></router-outlet>
</main>

<footer class="main-footer">
    <div class="footer-content">
        <p>&copy; 2025 Tech Blog. All rights reserved.</p>
    </div>
</footer>
